<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TERAMERGE — Team</title>
<meta name="description" content="The people behind the intelligence. An immersive introduction to the Teramerge team." />
<meta name="theme-color" content="#0D1110" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="team3d.css?v=8" />
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<!-- scan frame + crosshairs + rulers -->
<div class="frame" aria-hidden="true">
  <span class="cross c-tl">+</span><span class="cross c-tr">+</span>
  <span class="cross c-bl">+</span><span class="cross c-br">+</span>
  <span class="cross c-l">+</span><span class="cross c-c">+</span><span class="cross c-r">+</span>
  <span class="ruler ruler--top"></span>
  <span class="ruler ruler--bot"></span>
</div>

<!-- persistent HUD -->
<a class="hud hud--brand" href="../index.html">Teramerge</a>
<div class="hud hud--idx" id="idx">[[ 001 ]]</div>
<a class="hud hud--menu" href="../company/#build">Back</a>

<!-- huge wordmark (right side) -->
<div class="watermark" id="watermark" aria-hidden="true">TEAM</div>

<!-- active member — name / role bottom-left -->
<div class="info" id="info">
  <div class="info__name" id="infoName"></div>
  <div class="info__title" id="infoTitle"></div>
  <div class="info__bar"><i id="infoBar"></i></div>
</div>

<!-- descriptive copy bottom-right -->
<p class="blurb" id="infoBio"></p>

<!-- navigation -->
<nav class="nav" id="nav" aria-label="Team members">
  <button class="nav__arrow" id="prev" aria-label="Previous">&larr;</button>
  <div class="nav__count"><span id="curNo">01</span><i>/</i><span id="totNo">05</span></div>
  <button class="nav__arrow" id="next" aria-label="Next">&rarr;</button>
</nav>
<div class="dots" id="dots" aria-hidden="true"></div>
<div class="swipehint" id="swipehint">Scroll or drag to explore</div>

<!-- loading -->
<div class="load" id="load">
  <div class="load__brand">TERAMERGE</div>
  <div class="load__t">Initializing intelligence</div>
  <div class="load__bar"><i id="loadBar"></i></div>
  <div class="load__pct" id="loadPct">0%</div>
</div>

<!-- 2D fallback -->
<div class="fallback" id="fallback" hidden>
  <div class="fb__eye">Teramerge · Team</div>
  <h1 class="fb__title">The people behind<br>the intelligence.</h1>
  <div class="fb__grid" id="fbGrid"></div>
  <a class="fb__cta" href="../company/">Back to Company &rarr;</a>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module" src="team3d.js?v=16"></script>
<script src="../assets/music.js?v=1" defer></script>
</body>
</html>
